{{- define "main" -}}
  <div class="search-page">
    <div class="search-panel">
      <p class="search-hint">{{ .Params.placeholder | default "输入关键字搜索文章…" }}</p>
      <div id="searchbox" class="searchbox" role="search">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.6-3.6"></path>
          </svg>
        </span>
        <input id="searchInput" type="search" autocomplete="off" maxlength="64"
          placeholder="{{ .Params.placeholder | default "输入关键字搜索文章…" }}"
          aria-label="搜索文章" aria-describedby="searchMeta" disabled>
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
      </div>
      <p id="searchMeta" class="search-meta" aria-live="polite">正在加载搜索索引…</p>
      <ul id="searchResults" class="searchResults" aria-label="搜索结果"></ul>
      <noscript><p class="search-noscript">搜索需要启用 JavaScript。</p></noscript>
    </div>
  </div>

  {{- $fuse := resources.Get "js/fuse.basic.min.js" | minify | fingerprint -}}
  {{- $search := resources.Get "js/search.js" | minify | fingerprint -}}
  <script src="{{ $fuse.RelPermalink }}" defer></script>
  <script src="{{ $search.RelPermalink }}" defer></script>
{{- end -}}
