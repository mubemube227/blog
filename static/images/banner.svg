<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12132b"/>
      <stop offset="0.42" stop-color="#2b2c5e"/>
      <stop offset="0.72" stop-color="#4d4e93"/>
      <stop offset="1" stop-color="#7d73b8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#c9c3ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c9c3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd7ef" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffd7ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#08091a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#08091a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1920" height="600" fill="url(#sky)"/>
  <ellipse cx="1460" cy="170" rx="520" ry="360" fill="url(#halo)" filter="url(#soft)"/>
  <ellipse cx="420" cy="520" rx="460" ry="260" fill="url(#warm)" filter="url(#soft)"/>
  <ellipse cx="980" cy="360" rx="700" ry="260" fill="url(#shade)" filter="url(#soft)"/>

  <g fill="#ffffff">
    <circle cx="180" cy="110" r="2.2" opacity="0.8"/>
    <circle cx="320" cy="180" r="1.4" opacity="0.55"/>
    <circle cx="520" cy="90" r="1.8" opacity="0.7"/>
    <circle cx="760" cy="150" r="1.2" opacity="0.5"/>
    <circle cx="980" cy="80" r="2" opacity="0.65"/>
    <circle cx="1120" cy="210" r="1.3" opacity="0.5"/>
    <circle cx="1280" cy="70" r="1.7" opacity="0.7"/>
    <circle cx="1640" cy="90" r="2.4" opacity="0.8"/>
    <circle cx="1780" cy="250" r="1.5" opacity="0.55"/>
    <circle cx="700" cy="300" r="1.6" opacity="0.4"/>
    <circle cx="150" cy="330" r="1.2" opacity="0.35"/>
    <circle cx="1180" cy="330" r="1.8" opacity="0.4"/>
  </g>

  <circle cx="1510" cy="150" r="64" fill="#f3edff" opacity="0.88"/>
  <circle cx="1542" cy="130" r="64" fill="#3b3c78" opacity="0.55"/>

  <path d="M0 470 C 260 410, 430 520, 720 470 S 1240 390, 1920 470 L1920 600 L0 600 Z" fill="url(#mist)"/>
  <path d="M0 520 C 300 470, 520 560, 840 520 S 1420 450, 1920 530 L1920 600 L0 600 Z" fill="#ffffff" opacity="0.04"/>

  <g stroke="#ffffff" stroke-width="1.2" opacity="0.1">
    <path d="M-80 640 L520 220"/>
    <path d="M40 680 L700 250"/>
    <path d="M1200 640 L1920 180"/>
    <path d="M1320 680 L2000 220"/>
  </g>
