# ============================================================
# 瓜圣帝君的博客 —— 站点配置（Hugo + Reimu 主题）
# 主题参数在 config/_default/params.yml，改样式优先看那里
# ============================================================
baseURL = "https://blog-7as.pages.dev/"
title = "瓜圣帝君的博客"
locale = "zh-CN"
defaultContentLanguage = "zh-CN"
defaultContentLanguageInSubdir = false
theme = "reimu"
enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true

[pagination]
  pagerSize = 10

# 只保留分类；标签页面已关闭
[taxonomies]
  category = "categories"

# 首页 JSON 是自建站内搜索的数据源，别删
[outputs]
  home = ["HTML", "RSS", "JSON"]

[languages]
  [languages.zh-CN]
    label = "简体中文"
    weight = 1
    hasCJKLanguage = true

[markup]
  [markup.highlight]
    noClasses = false
    guessSyntax = true
